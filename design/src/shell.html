<style>

<div class="grain"></div>

<header class="topbar">
  <div class="wrap topbar-in">
    <div class="brand">
      <div class="brand-mark"></div>
      <div class="brand-name" aria-label="{{copy:chrome.brand.label}}">Team<i class="slashes" aria-hidden="true"><b></b><b></b></i>Watch</div>
    </div>
    <a class="discordlink" href="https://discord.gg/KUzgvUmbxQ" target="_blank" rel="noopener noreferrer" title="{{copy:chrome.discord.tooltip}}" aria-label="{{copy:chrome.discord.tooltip}}">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.522 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1568 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/></svg>
    </a>
    <div class="topbar-spacer"></div>
    <span class="pill warn" id="topbadge"><span class="dot"></span><span class="full">{{copy:chrome.badge.defaultFull}}</span><span class="abbr">{{copy:chrome.badge.sampleAbbr}}</span></span>
    <span class="pill" id="weekpill"><span class="dot" style="color:var(--lime)"></span><span class="txt">{{copy:chrome.weekpill.text}}</span></span>
    <div class="statuswrap" id="feed"></div>
  </div>
</header>

<div class="navbar">
  <div class="wrap navrow">
    <div class="nav" id="nav"></div>
  </div>
</div>

<!-- The group's views. Painted by paintSubnav(), hidden entirely for a group of one so a sub-nav
     never shows a single tab the reader cannot move away from. Deliberately OUTSIDE .navbar: on a
     phone the navbar is fixed to the bottom edge, and a docked row inside it lands in the same
     slot Parlay's and DFS's own view switchers already occupy, covering them. Out here it sits in
     normal flow under the header, where nothing competes with it. -->
<div class="subnav" id="subnav" hidden><div class="wrap subnav-in"></div></div>

<main id="view"></main>

<div class="wrap">
  <div class="foot">
    <span>{{copy:chrome.footer.sources}}</span>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>

<!-- The player profile is a centered popup, not a slide-over: it carries far more data than
     the drawer's other two uses (the pool and DFS explain), so it gets its own scrim and its
     own scale+fade-from-the-row motion (js/chrome/modal.js) instead of sharing #drawer's. -->
<div class="modal-scrim" id="modal-scrim"></div>
<div class="modal" id="modal" aria-hidden="true" data-scrim="modal-scrim"></div>

<!-- The drive strip. A second dialog rather than a second use of #modal, because it opens FROM
     the profile: tapping a week in a player's game log must not throw away the profile he is
     still reading. They stack, and Escape closes whichever is on top. -->
<div class="modal-scrim" id="strip-scrim"></div>
<div class="modal stripmodal" id="stripmodal" aria-hidden="true" data-scrim="strip-scrim"></div>

<!-- The chat launcher and its panel sit outside #view on purpose: render() replaces #view's
     markup on every surface change, so anything inside it loses its state. Out here the
     conversation survives navigating between tabs, which is the point of it being a panel
     rather than a tab of its own. Deliberately not a modal -- no scrim, no focus trap -- so
     the page behind stays usable while a question is open. -->
<button class="chatfab" id="chatfab" aria-expanded="false" aria-controls="chatdock"></button>
<aside class="chatdock" id="chatdock" aria-hidden="true"></aside>
